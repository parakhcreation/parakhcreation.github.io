<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Details</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#faf8f5;
    color:#222;
}

.container{

    width:90%;
    max-width:1300px;

    margin:60px auto;

}

.cart-drawer{

    position:fixed;

    top:0;

    right:-420px;

    width:380px;

    height:100%;

    background:white;

    box-shadow:-5px 0 20px rgba(0,0,0,.15);

    transition:.35s;

    z-index:9999;

}

.cart-drawer.open{

    right:0;

}

.drawer-content{

    padding:40px;

}

.drawer-buttons{

    margin-top:30px;

    display:flex;

    flex-direction:column;

    gap:15px;

}

.drawer-buttons button{

    padding:15px;

    cursor:pointer;

}

.product-page{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:60px;

    align-items:start;

}

.product-image img{

    width:100%;

    border-radius:10px;

    box-shadow:0 8px 30px rgba(0,0,0,.1);

}

.product-info h1{

    font-size:42px;

    margin-bottom:10px;

}

.price{

    font-size:34px;

    color:#b11b47;

    font-weight:bold;

    margin:25px 0;

}

.info{

    margin:18px 0;

    font-size:18px;

}

.description{

    margin:35px 0;

    line-height:1.8;

}

.buttons{

    display:flex;

    gap:20px;

    margin-top:40px;

}

button{

    flex:1;

    padding:18px;

    border:none;

    cursor:pointer;

    font-size:18px;

    border-radius:6px;

}

#addToCart{

    background:#222;

    color:white;

}

#buyNow{

    background:#b11b47;

    color:white;

}
#addToWishlist{

    background:white;

    color:#b11b47;

    border:2px solid #b11b47;

}

#addToWishlist:hover{

    background:#b11b47;

    color:white;

}

.related{

    margin-top:100px;

}

.related h2{

    margin-bottom:30px;

}

.related-grid{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:25px;

}

.related-card{

    background:white;

    border-radius:10px;

    padding:15px;

    box-shadow:0 5px 15px rgba(0,0,0,.08);

    text-align:center;

}

.related-card img{

    width:100%;

    border-radius:8px;

}

@media(max-width:900px){

.product-page{

grid-template-columns:1fr;

}

.related-grid{

grid-template-columns:repeat(2,1fr);

}

}

</style>

</head>

<body>

<div class="container">

<div class="product-page">

<div class="product-image">

<img id="productImage">

</div>

<div class="product-info">

<h1 id="productName"></h1>

<div
class="price"
id="productPrice"></div>

<div class="info">

<strong>Fabric:</strong>

<span id="productFabric"></span>

</div>

<div class="info">

<strong>Colour:</strong>

<span id="productColour"></span>

</div>

<div class="info">

<strong>Status:</strong>

<span id="productAvailability"></span>

</div>

<div
class="description"
id="productDescription"></div>

<div class="buttons">

    <button id="addToCart">

        Add to Cart

    </button>

    <button id="buyNow">

        Buy Now

    </button>

    <button id="addToWishlist">

        ♡ Add to Wishlist

    </button>

</div>

</div>

</div>

<div class="related">

<h2>

You May Also Like

</h2>

<div
class="related-grid"
id="relatedProducts">

</div>

</div>

</div>

<div id="cartDrawer" class="cart-drawer">

    <div class="drawer-content">

        <h2>✔ Added to Cart</h2>

        <p id="drawerProductName"></p>

        <div class="drawer-buttons">

            <button id="viewCart">
                View Cart
            </button>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script type="module" src="js/wishlistStore.js"></script>

<script type="module" src="js/product.js"></script>

</body>

</html>
