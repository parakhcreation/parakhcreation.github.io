<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width, initial-scale=1.0">

<title>Wishlist</title>

<link rel="stylesheet"

      href="css/style.css">

      <link rel="preconnect" href="https://fonts.googleapis.com">

<link
    href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@500;600&display=swap"
    rel="stylesheet">

</head>

<style>

/* =========================================================
   WISHLIST PAGE — PARAKH HEADER
   ========================================================= */

.product-nav{

    width:100%;

    background:#f3e9d8;

    border-bottom:1px solid rgba(0,0,0,.08);

}

.product-nav-inner{

    width:92%;

    max-width:1400px;

    min-height:78px;

    margin:0 auto;

    padding:10px 0;

    box-sizing:border-box;

    display:flex;

    align-items:center;

    justify-content:space-between;

}


/* =========================
   PARAKH LOGO
   ========================= */

.product-brand{

    display:flex;

    align-items:baseline;

    gap:10px;

    flex-shrink:0;

}

.product-brand .brand-dev{

    font-family:'Noto Serif Devanagari',serif;

    font-size:30px;

    line-height:1;

    color:#A8194A;

}

.product-brand .brand-word{

    display:block;

    font-family:'Marcellus','Cormorant Garamond',serif;

    font-size:40px;

    line-height:1;

    letter-spacing:.06em;

    color:#123A34;

}

.product-brand .brand-sub{

    display:block;

    margin-top:-2px;

    font-family:'Poppins',sans-serif;

    font-size:20px;

    line-height:1;

    letter-spacing:.18em;

    text-transform:uppercase;

    color:#8F6A1F;

}


/* =========================
   HEADER ICONS
   ========================= */

.product-nav-icons{

    margin-left:auto;

    display:flex;

    align-items:center;

    gap:18px;

}

.product-nav-icons .icon-btn{

    position:relative;

    border:none;

    background:none;

    padding:0;

    margin:0;

    font-size:26px;

    line-height:1;

    color:#123A34;

    cursor:pointer;

}

.product-nav-icons .cart-icon{

    position:relative;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    font-size:28px;

    line-height:1;

    color:#123A34;

    text-decoration:none;

}


/* Counters */

.product-nav #wishlistCount,
.product-nav #cartCount{

    position:absolute;

    top:-7px;

    right:-9px;

    width:20px;

    height:20px;

    border-radius:50%;

    background:#C91B4F;

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-family:Arial,sans-serif;

    font-size:10px;

    font-weight:700;

}


/* =========================
   MOBILE
   ========================= */

@media(max-width:768px){

    .product-nav-inner{

        width:100%;

        min-height:58px;

        padding:7px 16px;

    }

    .product-brand{

        gap:6px;

    }

    .product-brand .brand-dev{

        font-size:13px;

    }

    .product-brand .brand-word{

        font-size:20px;

    }

    .product-brand .brand-sub{

        font-size:10px;

        letter-spacing:.18em;

    }

    .product-nav-icons{

        gap:10px;

    }

    .product-nav-icons .icon-btn{

        font-size:20px;

    }

    .product-nav-icons .cart-icon{

        font-size:20px;

    }

    .product-nav #wishlistCount,
    .product-nav #cartCount{

        width:16px;

        height:16px;

        top:-7px;

        right:-7px;

        font-size:8px;

    }

}

/* =========================
   WISHLIST REMOVE BUTTON
   ========================= */

#wishlistGrid .card-actions button {

    border: 1px solid #B8872B;

    background: transparent;

    color: #123A34;

    padding: 8px 18px;

    border-radius: 3px;

    font-family: 'Poppins', sans-serif;

    font-size: 12px;

    font-weight: 600;

    letter-spacing: .04em;

    cursor: pointer;

    transition:
        background .2s ease,
        color .2s ease,
        border-color .2s ease;

}


#wishlistGrid .card-actions button:hover {

    background: #123A34;

    color: #fff;

    border-color: #123A34;

}

/* =========================
   WISHLIST TITLE
   ========================= */

.wishlist-title {

    text-align: center;

    margin-top: 40px;

    margin-bottom: 25px;

    font-family: 'Marcellus', serif;

    font-size: 34px;

    font-weight: 500;

    color: #123A34;

    line-height: 1.2;

}

</style>

<body>

<header class="product-nav">

    <div class="product-nav-inner">

        <!-- PARAKH LOGO -->

        <div class="product-brand">

            <span class="brand-dev">पारख</span>

            <span>

                <span class="brand-word">
                    PARAKH
                </span>

                <span class="brand-sub">
                    Creation &amp; Collection
                </span>

            </span>

        </div>


        <!-- WISHLIST / ACCOUNT / CART -->

        <div class="product-nav-icons">

            <button
                class="icon-btn"
                id="wishlistPageWishlistBtn"
                type="button"
                onclick="location.href='wishlist.html'"
                aria-label="Wishlist">

                ❤

                <span id="wishlistCount">0</span>

            </button>


            <button
                class="icon-btn"
                id="wishlistPageAccountBtn"
                type="button"
                onclick="location.href='account.html'"
                aria-label="My Account">

                👤

            </button>


            <a
                href="cart.html"
                class="cart-icon"
                aria-label="Cart">

                🛒

                <span id="cartCount">0</span>

            </a>

        </div>

    </div>

</header>


<h1 class="wishlist-title">

    My Wishlist

</h1>

<div id="wishlistGrid"

     class="product-grid"

     style="width:90%;margin:auto;">

</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script type="module" src="js/wishlistStore.js"></script>

<script type="module" src="js/wishlist.js"></script>

<script type="module">

import { Cart } from "./js/cartStore.js";

async function updateCartHeaderCount(){

    const countElement =
        document.getElementById("cartCount");

    if(!countElement) return;

    const cart =
        await Cart.getAll();

    const total =
        Object.values(cart)
            .reduce(
                (sum, quantity) =>
                    sum + Number(quantity || 0),
                0
            );

    countElement.textContent = total;

}

updateCartHeaderCount();

</script>

</body>

</html>
