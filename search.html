<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.1.0"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>
Search Results | Parakh Creation
</title>
<meta name="description" content="Parakh Creation &amp; Parakh Collection — sarees and suit sets, from two stores in Howrah. Browse the collection and enquire directly on WhatsApp or call.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ NAV ============ -->
<header class="nav" id="navbar">
  <div class="nav-inner">
    <a class="brand" href="#top">
      <span class="brand-dev">पारख</span>
      <span>
        <span class="brand-word">PARAKH</span>
        <span class="brand-sub">Creation &amp; Collection</span>
      </span>
    </a>
    <nav class="nav-links" id="navLinks">

    <a href="#about">About</a>
    <a href="#collection">Collection</a>
    <a href="#lookbook">Lookbook</a>
    <a href="#contact">Visit Us</a>

</nav>

<div class="nav-icons">

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search sarees, suits, fabrics, colours...">

    </div>

    <button
        class="icon-btn"
        id="wishlistBtn"
        onclick="location.href='wishlist.html'">

        ❤

        <span id="wishlistCount">0</span>

    </button>

    <button
        class="icon-btn"
        id="accountBtn">

        👤

    </button>

    <a
        href="cart.html"
        class="cart-icon">

        🛒

        <span id="cartCount">0</span>

    </a>

</div>
    
    <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">&#9776;</button>
  </div>
</header>


<section class="search-page">

    <div class="search-header">

        <div>

            <h2 id="searchHeading">
                Search Results
            </h2>

            <p id="searchCount"></p>

        </div>

        <div>

            <select id="sortSelect">

                <option value="relevance">
                    Relevance
                </option>

                <option value="priceLow">
                    Price: Low to High
                </option>

                <option value="priceHigh">
                    Price: High to Low
                </option>

                <option value="name">
                    Name (A–Z)
                </option>

                <option value="nameDesc">
                    Name (Z–A)
                </option>

            </select>

        </div>

    </div>

    <div class="search-layout">

        <aside class="filters">

    <h3>Filters</h3>

    <div id="filterContainer">

    </div>

    <button id="mobileFilterOk">
        OK
    </button>

</aside>

        <main>

            <div
                id="searchResults"
                class="search-grid">

            </div>

        </main>

    </div>

</section>



<!-- ============ PRODUCT MODAL ============ -->

<div class="mobile-filter-bar">

    <button id="mobileFilterBtn">
        FILTER
    </button>

    <button id="mobileSortBtn">
        SORT
    </button>

</div>

<div class="mobile-sort-menu" id="mobileSortMenu">

    <div class="mobile-sort-header">
        <span>Sort By</span>

        <button id="mobileSortClose">
            ×
        </button>
    </div>

    <button data-sort="relevance">
        Relevance
    </button>

    <button data-sort="priceLow">
        Price: Low to High
    </button>

    <button data-sort="priceHigh">
        Price: High to Low
    </button>

    <button data-sort="name">
        Name (A–Z)
    </button>

    <button data-sort="nameDesc">
        Name (Z–A)
    </button>

</div>

<script type="module" src="js/firebase.js"></script>

<script src="js/products.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script type="module" src="js/wishlistStore.js"></script>
<script type="module" src="js/cartStore.js"></script>
<script type="module" src="js/profileStore.js"></script>
<script type="module" src="js/search.js"></script>


<script type="module" src="js/customerAuth.js"></script>
<script>

window.addEventListener("scroll",()=>{

    const nav=document.getElementById("navbar");

    if(window.scrollY>40){

        nav.classList.add("scrolled");

    }

    else{

        nav.classList.remove("scrolled");

    }

});

</script>
</body>
</html>
