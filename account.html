<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Account | Parakh</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>


select{

width:100%;

padding:12px;

margin-top:5px;

border:1px solid #ddd;

border-radius:8px;

font-size:15px;

}

input{

width:100%;

padding:12px;

margin-top:5px;

border:1px solid #ddd;

border-radius:8px;

font-size:15px;

box-sizing:border-box;

}
body{

background:#F8F0E2;

font-family:Inter,sans-serif;

}

.card{

background:white;

max-width:500px;

margin:80px auto;

padding:50px;

border-radius:18px;

box-shadow:0 12px 40px rgba(0,0,0,.08);

}

h1{

font-family:"Cormorant Garamond",serif;

font-size:44px;

margin-bottom:30px;

color:#063C3D;

}

.label{

font-size:13px;

color:#777;

margin-top:18px;

}

.value{

font-size:18px;

margin-top:4px;

font-weight:500;

}

button{

margin-top:35px;

width:100%;

padding:14px;

background:#7A1436;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

font-size:15px;

}

button:hover{

background:#5f0f2b;

}

</style>

</head>

<body>

<div class="card">

<h1>My Account</h1>

<div class="label">Name</div>

<div class="value" id="accountName">Loading...</div>

<div class="label">Email</div>

<div class="value" id="accountEmail">Loading...</div>


<hr style="margin:30px 0;">

<h2 style="margin-bottom:20px;">Complete Your Profile</h2>

<div class="label">First Name</div>
<input id="firstName" type="text">

<div class="label">Last Name</div>
<input id="lastName" type="text">

<div class="label">Phone</div>
<input id="profilePhone" type="text">

<div class="label">Gender</div>
<select id="gender">

    <option value="">Select</option>

    <option value="Male">Male</option>

    <option value="Female">Female</option>

    <option value="Other">Other</option>

</select>

<div class="label">Date of Birth</div>
<input id="dob" type="date">

<button id="saveProfileBtn">

Save Profile

</button>
<hr style="margin:35px 0;">

<h2 style="margin-bottom:20px;">Saved Addresses</h2>

<div id="addressList">

    <p>No saved addresses yet.</p>

</div>

<button id="addAddressBtn">

+ Add New Address

</button>

<div id="addressForm" style="display:none; margin-top:25px;">

    <h3>Add New Address</h3>

    <label>Address Type</label>

    <select id="addressType">

        <option value="Home">Home</option>

        <option value="Work">Work</option>

        <option value="Other">Other</option>

    </select>

    <label>Address Line 1</label>

    <input id="addressLine1" type="text">

    <label>Address Line 2</label>

    <input id="addressLine2" type="text">

    <label>Landmark</label>

    <input id="landmark" type="text">

    <label>City</label>

    <input id="city" type="text">

    <label>State</label>

    <input id="state" type="text">

    <label>PIN Code</label>

    <input id="pincode" type="text">

    <label style="display:flex;align-items:center;margin-top:15px;gap:10px;">

        <input
            id="defaultAddress"
            type="checkbox"
            style="width:auto;">

        Set as Default

    </label>

    <button id="saveAddressBtn">

        Save Address

    </button>

</div>
<button id="logoutBtn">

Logout

</button>

</div>

<script type="module" src="js/customerAuth.js"></script>

<script type="module" src="js/profileStore.js"></script>

<script type="module" src="js/addressStore.js"></script>

<script type="module" src="js/account.js"></script>
<script type="module" src="js/address.js"></script>

</body>

</html>
