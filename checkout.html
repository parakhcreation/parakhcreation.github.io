<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Checkout</title>

<link rel="stylesheet" href="style.css">

<style>

body{

    margin:0;
    background:#f8f6f2;
    font-family:Arial,Helvetica,sans-serif;

}

.container{

    width:92%;
    max-width:1400px;
    margin:50px auto;

}

h1{

    margin-bottom:40px;

}

.checkout-layout{

    display:grid;

    grid-template-columns:2fr 1fr;

    gap:40px;

}

.form-box{

    background:white;

    padding:35px;

    border-radius:14px;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

}

.form-group{

    margin-bottom:20px;

}

label{

    display:block;

    margin-bottom:8px;

    font-weight:bold;

}
.required{

    color:red;

    font-weight:bold;

}

input,
textarea{

    width:100%;

    padding:14px;

    border:1px solid #ddd;

    border-radius:8px;

    font-size:16px;

    box-sizing:border-box;

}

textarea{

    resize:vertical;

}

.summary{

    background:white;

    padding:30px;

    border-radius:14px;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

    position:sticky;

    top:30px;

    height:fit-content;

}

.total-row{

    display:flex;

    justify-content:space-between;

    margin:15px 0;

}

#orderItems{

    margin-bottom:25px;

}

.checkoutBtn{

    width:100%;

    padding:18px;

    border:none;

    background:#b11b47;

    color:white;

    font-size:18px;

    border-radius:8px;

    cursor:pointer;

}

@media(max-width:900px){

.checkout-layout{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div class="container">

<h1>Checkout</h1>

<div class="checkout-layout">

<div class="form-box">

<div class="form-group">
<label>Full Name <span class="required">*</span></label>
<input
    id="name"
    type="text"
    required
    placeholder="Enter your full name">
</div>

<div class="form-group">
<label>Mobile Number <span class="required">*</span></label>
<input
    id="phone"
    type="tel"
    required
    maxlength="10"
    pattern="[0-9]{10}"
    placeholder="10-digit mobile number">
</div>

<div class="form-group">
<label>Email (Optional)</label>
<input id="email" type="email">
</div>

<div class="form-group">
<label>Address <span class="required">*</span></label>
<textarea
    id="address"
    rows="4"
    required
    placeholder="House No., Street, Area"></textarea>
</div>

<div class="form-group">
<label>City <span class="required">*</span></label>
<input
    id="city"
    type="text"
    required
    placeholder="Enter your city">
</div>

<div class="form-group">
<label>State <span class="required">*</span></label>
<input
    id="state"
    type="text"
    required
    placeholder="Enter your state">
</div>

<div class="form-group">
<label>Pincode <span class="required">*</span></label>
<input
    id="pincode"
    type="text"
    required
    maxlength="6"
    pattern="[0-9]{6}"
    placeholder="6-digit PIN code">
</div>

</div>

<div class="summary">

<h2>Order Summary</h2>

<div id="orderItems"></div>

<hr>

<div class="total-row">

<span>Total</span>

<strong id="checkoutTotal">

₹0

</strong>

</div>

<button
class="checkoutBtn"
id="payNow">

Proceed to Payment

</button>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script type="module" src="js/checkout.js"></script>

</body>

</html>
