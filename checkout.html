<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Parakh</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#f8f6f2;
    font-family:Manrope,sans-serif;
    color:#222;

}

.container{

    width:min(1400px,94%);
    margin:auto;
    padding:40px 0;

}

.pageTitle{

    font-family:Marcellus,serif;
    font-size:40px;
    margin-bottom:35px;

}

.checkoutGrid{

    display:grid;
    grid-template-columns:2fr 1fr;
    gap:35px;
    align-items:start;

}

.card{

    background:white;
    border-radius:18px;
    padding:28px;
    box-shadow:0 10px 25px rgba(0,0,0,.06);
    margin-bottom:25px;

}

.cardTitle{

    font-size:22px;
    font-weight:700;
    margin-bottom:22px;

}

.addressCard{

    border:2px solid #e8e8e8;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
    cursor:pointer;
    transition:.25s;

}

.addressCard:hover{

    border-color:#8c1d40;

}

.addressCard.selected{

    border-color:#8c1d40;
    background:#fff8fa;

}

.addressType{

    font-weight:700;
    margin-bottom:8px;

}

.defaultBadge{

    display:inline-block;
    background:#0d4b43;
    color:white;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    margin-left:8px;

}

.addressText{

    color:#555;
    line-height:1.7;

}

.addAddress{

    width:100%;
    padding:15px;
    border:2px dashed #bbb;
    background:white;
    border-radius:14px;
    cursor:pointer;
    font-size:16px;
    transition:.25s;

}

.addAddress:hover{

    border-color:#8c1d40;
    color:#8c1d40;

}

.formRow{

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;

}

.formGroup{

    margin-bottom:20px;

}

.formGroup label{

    display:block;
    margin-bottom:8px;
    font-weight:600;

}

.formGroup input{

    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;

}

.smallText{

    color:#777;
    margin-top:10px;
    font-size:14px;

}

.paymentOption{

    border:2px solid #e8e8e8;
    padding:18px;
    border-radius:14px;
    margin-bottom:15px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;

}

.paymentOption:hover{

    border-color:#8c1d40;

}

.paymentOption input{

    transform:scale(1.2);

}

.summaryCard{

    position:sticky;
    top:30px;
    background:white;
    border-radius:18px;
    padding:28px;
    box-shadow:0 10px 25px rgba(0,0,0,.06);

}

.summaryTitle{

    font-size:24px;
    font-weight:700;
    margin-bottom:25px;

}

.summaryProducts{

    margin-bottom:25px;

}

.summaryItem{

    display:flex;
    gap:14px;
    margin-bottom:18px;

}

.summaryImage{

    width:75px;
    height:95px;
    object-fit:cover;
    border-radius:10px;

}

.summaryInfo{

    flex:1;

}

.summaryName{

    font-weight:600;
    margin-bottom:8px;

}

.summaryPrice{

    color:#666;

}

.row{

    display:flex;
    justify-content:space-between;
    margin:15px 0;

}

.grandTotal{

    font-size:22px;
    font-weight:700;

}

.placeOrder{

    width:100%;
    padding:18px;
    border:none;
    border-radius:12px;
    background:#8c1d40;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:25px;

}

.placeOrder:hover{

    background:#6f1633;

}

@media(max-width:950px){

.checkoutGrid{

grid-template-columns:1fr;

}

.summaryCard{

position:static;

}

.formRow{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div class="container">

<h1 class="pageTitle">

Checkout

</h1>

<div class="checkoutGrid">

<div>

<!-- DELIVERY ADDRESS -->

<div class="card">

<div class="cardTitle">

Delivery Address

</div>

<div id="addressContainer">

<!-- Loaded from Firebase -->

</div>

<button
class="addAddress"
id="addNewAddress">

+ Add New Address

</button>

<div
id="newAddressForm"
style="display:none;margin-top:25px;">

    <div class="formGroup">

        <label>Address Type</label>

        <select id="newAddressType">

            <option>Home</option>

            <option>Work</option>

            <option>Other</option>

        </select>

    </div>

    <div class="formGroup">

        <label>Address Line 1</label>

        <input
        id="newAddressLine1"
        type="text">

    </div>

    <div class="formGroup">

        <label>Address Line 2</label>

        <input
        id="newAddressLine2"
        type="text">

    </div>

    <div class="formGroup">

        <label>Landmark</label>

        <input
        id="newLandmark"
        type="text">

    </div>

    <div class="formRow">

        <div class="formGroup">

            <label>City</label>

            <input
            id="newCity"
            type="text">

        </div>

        <div class="formGroup">

            <label>State</label>

            <input
            id="newState"
            type="text">

        </div>

    </div>

    <div class="formGroup">

        <label>PIN Code</label>

        <input
        id="newPincode"
        type="text">

    </div>

    <label
    style="display:flex;gap:10px;align-items:center;margin-bottom:20px;">

        <input
        id="newDefault"
        type="checkbox"
        style="width:auto;">

        Set as Default

    </label>

    <div
    style="display:flex;gap:15px;">

        <button
        id="saveCheckoutAddress"
        type="button"
        style="flex:1;">

            Save Address

        </button>

        <button
        id="cancelCheckoutAddress"
        type="button"
        style="flex:1;background:#ddd;color:#222;">

            Cancel

        </button>

    </div>

</div>

</div>

<!-- RECIPIENT DETAILS -->

<div class="card">

<div class="cardTitle">

Recipient Details

</div>

<div class="formRow">

<div class="formGroup">

<label>

Recipient Name

</label>

<input
id="recipientName"
type="text">

</div>

<div class="formGroup">

<label>

Phone Number

</label>

<input
id="recipientPhone"
type="text">

</div>

</div>

<div class="smallText">

These details are used only for this order and will not update your account profile.

</div>

</div>

<!-- PAYMENT -->

<div class="card">

<div class="cardTitle">

Payment Method

</div>

<label class="paymentOption">

<input
type="radio"
name="payment"
value="COD"
checked>

<div>

<strong>

Cash on Delivery

</strong>

<br>

Pay when your order arrives.

</div>

</label>

<label class="paymentOption">

<input
type="radio"
name="payment"
value="Razorpay">

<div>

<strong>

Razorpay

</strong>

<br>

UPI, Cards, Net Banking & Wallets

</div>

</label>

</div>

</div>

<!-- RIGHT SIDE STARTS -->

<div class="summaryCard">

    <div class="summaryTitle">

        Order Summary

    </div>

    <div id="summaryProducts" class="summaryProducts">

        <!-- Products loaded from checkout.js -->

    </div>

    <hr>

    <div class="row">

        <span>Subtotal</span>

        <span id="subtotal">

            ₹0

        </span>

    </div>

    <div class="row">

        <span>Shipping</span>

        <span id="shipping">

            FREE

        </span>

    </div>

    <div class="row">

        <span>Discount</span>

        <span id="discount">

            ₹0

        </span>

    </div>

    <hr style="margin:20px 0;">

    <div class="row grandTotal">

        <span>

            Grand Total

        </span>

        <span id="grandTotal">

            ₹0

        </span>

    </div>

    <button
        class="placeOrder"
        id="placeOrderBtn">

        PLACE ORDER

    </button>

</div>

</div>

</div>

<script type="module" src="js/profileStore.js"></script>

<script type="module" src="js/addressStore.js"></script>

<script type="module" src="js/cartStore.js"></script>

<script type="module" src="js/orderStore.js"></script>

<script type="module" src="js/checkout.js"></script>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

</body>

</html>
