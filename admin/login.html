<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parakh Creation | Admin Login</title>

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>Parakh Creation</h1>

        <p class="subtitle">
            Admin Login
        </p>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

            <p id="errorMessage"></p>

        </form>

    </div>

</div>

<script type="module" src="../js/auth.js"></script>

</body>
</html>
