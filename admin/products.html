<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Products | Parakh Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/admin.css">

</head>

<body>

<div class="container-fluid">

<div class="row">

<div class="col-md-2 bg-dark text-white min-vh-100 p-4">

<h3>Parakh Admin</h3>

<hr>

<a href="index.html" class="btn btn-outline-light w-100 mb-2">Dashboard</a>

<a href="products.html" class="btn btn-light w-100 mb-2">
Products
</a>

<a href="#" class="btn btn-outline-light w-100 mb-2">
Orders
</a>

<a href="#" class="btn btn-outline-light w-100 mb-2">
Users
</a>

<hr>

<button
id="logoutBtn"
class="btn btn-danger w-100">

Logout

</button>

</div>

<div class="col-md-10 p-4">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2>Products</h2>

<button
    class="btn btn-primary"
    data-bs-toggle="modal"
    data-bs-target="#productModal">

    + Add Product

</button>

</div>

<div class="card">

<div class="card-body">

<div class="table-responsive">

<table class="table table-hover align-middle">

<thead>

<tr>

<th>Image</th>
<th>ID</th>
<th>Name</th>
<th>Category</th>
<th>Price</th>
<th>Stock</th>
<th>Available</th>
<th>Actions</th>

</tr>

</thead>

<tbody id="productsTable">

<tr>

<td colspan="8" class="text-center">

Loading products...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</div>

<!-- Product Modal -->

<div class="modal fade" id="productModal" tabindex="-1">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">

Add Product

</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<form id="productForm">

<div class="row">

<div class="col-md-6 mb-3">

<label>ID</label>

<input
id="id"
class="form-control"
readonly>

</div>

<div class="col-md-6 mb-3">

<label>Name</label>

<input
id="name"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label>Category</label>

<select
id="category"
class="form-select">

<option value="saree">Saree</option>

<option value="suit">Suit</option>

</select>

</div>

<div class="col-md-6 mb-3">

    <label>Main Product Image</label>

    <input
        type="file"
        id="productImage"
        class="form-control"
        accept="image/*">
        
        <img
    id="imagePreview"
    src=""
    class="img-fluid rounded border mt-3 d-none"
    style="
        max-height:250px;
        max-width:100%;
        object-fit:contain;
    ">

<div class="mt-2">

    <button
        type="button"
        id="removeImageBtn"
        class="btn btn-outline-danger btn-sm d-none">

        Remove Image

    </button>

</div>

</div>

<div class="col-md-6 mb-3">

<label>Fabric</label>

<input
id="fabric"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Colour</label>

<input
id="colour"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Price</label>

<input
id="price"
type="number"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label>Stock</label>

<input
id="stock"
type="number"
value="0"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Collection</label>

<input
id="collection"
class="form-control">



</div>

<div class="col-12 mb-3">

<label>Description</label>

<textarea
id="description"
class="form-control"
rows="3"></textarea>

</div>

<div class="col-md-6">

<div class="form-check">

<input
type="checkbox"
id="available"
class="form-check-input"
checked>

<label class="form-check-label">

Available

</label>

</div>

</div>

<div class="col-md-6">

<div class="form-check">

<input
type="checkbox"
id="featured"
class="form-check-input">

<label class="form-check-label">

Featured

</label>

</div>

</div>

</div>

</form>

</div>

<div class="modal-footer">

<button
class="btn btn-secondary"
data-bs-dismiss="modal">

Cancel

</button>

<button
id="saveProductBtn"
class="btn btn-primary">

Save Product

</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="js/products.js"></script>

</body>

</html>
