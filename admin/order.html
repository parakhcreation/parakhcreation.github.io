<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Order Details | Parakh Admin</title>

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<link
rel="stylesheet"
href="css/admin.css">

</head>

<body class="bg-light">

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <a
            href="orders.html"
            class="btn btn-outline-secondary">

            ← Back to Orders

        </a>

        <h2 id="pageTitle">

            Order Details

        </h2>

    </div>

    <!-- TOP SUMMARY -->

    <div class="row g-4 mb-4">

        <div class="col-lg-3">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <small class="text-muted">

                        Grand Total

                    </small>

                    <h3
                        id="summaryTotal"
                        class="mt-2">

                        ₹0

                    </h3>

                </div>

            </div>

        </div>

        <div class="col-lg-3">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <small class="text-muted">

                        Payment Status

                    </small>

                    <div
                        id="paymentBadge"
                        class="mt-2">

                        -

                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-3">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <small class="text-muted">

                        Order Status

                    </small>

                    <div
                        id="orderBadge"
                        class="mt-2">

                        -

                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-3">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <small class="text-muted">

                        Order Date

                    </small>

                    <div
                        id="orderDate"
                        class="mt-2">

                        -

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- CUSTOMER + ADDRESS -->

    <div class="row g-4 mb-4">

        <div class="col-lg-6">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <h5 class="mb-4">

                        Customer Details

                    </h5>

                    <div id="customerInfo">

                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <h5 class="mb-4">

                        Delivery Address

                    </h5>

                    <div id="addressInfo">

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- PRODUCTS -->

    <div class="card shadow-sm border-0 mb-4">

        <div class="card-body">

            <h5 class="mb-4">

                Ordered Products

            </h5>

           <div id="productsTable">

</div>

        </div>

    </div>

    <!-- PAYMENT + ADMIN -->

    <div class="row g-4">

        <div class="col-lg-6">

            <div class="card shadow-sm border-0">

                <div class="card-body">

                    <h5 class="mb-4">

                        Payment Details

                    </h5>

                    <div id="paymentInfo">

                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="card shadow-sm border-0">

                <div class="card-body">

                    <h5 class="mb-4">

                        Admin Actions

                    </h5>

                    <label class="form-label">

                        Order Status

                    </label>

                    <select
                        id="statusSelect"
                        class="form-select mb-3">

                        <option>Pending</option>

                        <option>Confirmed</option>

                        <option>Packed</option>

                        <option>Shipped</option>

                        <option>Out for Delivery</option>

                        <option>Delivered</option>

                        <option>Cancelled</option>

                        <option>Returned</option>

                    </select>

                    <button
                        id="updateBtn"
                        class="btn btn-primary w-100 mb-4">

                        Update Order Status

                    </button>

                    <hr>

                    <label class="form-label">

                        Payment Status

                    </label>

                    <select
                        id="paymentStatusSelect"
                        class="form-select mb-3">

                        <option>Pending</option>

                        <option>Paid</option>

                        <option>Failed</option>

                        <option>Refunded</option>

                    </select>

                    <button
                        id="updatePaymentBtn"
                        class="btn btn-success w-100">

                        Update Payment Status

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script
type="module"
src="js/order.js">

</script>

</body>

</html>
