<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Order Details | Parakh Admin</title>

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<link
rel="stylesheet"
href="css/admin.css">

<style>

/* ============================================================
   CUSTOMER REVIEW IN ORDER
   ============================================================ */

.order-product-review {

    margin-top: 18px;

    padding: 18px;

    border-top: 1px solid #e9e9e9;

    background: #fafafa;

    border-radius: 10px;

}

.order-review-heading {

    font-weight: 600;

    font-size: 15px;

    margin-bottom: 10px;

}

.order-review-stars {

    color: #e6a400;

    font-size: 20px;

    letter-spacing: 2px;

}

.order-review-title {

    font-weight: 600;

    margin-top: 8px;

}

.order-review-comment {

    color: #555;

    line-height: 1.6;

    margin-top: 6px;

}

.order-review-meta {

    color: #777;

    font-size: 13px;

    margin-top: 10px;

}

.order-review-images {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 12px;

}

.order-review-images img {

    width: 100px;

    height: 100px;

    object-fit: cover;

    border-radius: 8px;

    border: 1px solid #ddd;

    cursor: pointer;

}

.order-review-video {

    margin-top: 12px;

    max-width: 350px;

    width: 100%;

    border-radius: 8px;

}

.order-review-actions {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    margin-top: 15px;

}

.order-review-actions button {

    border-radius: 6px;

}

.review-status-badge {

    display: inline-block;

    padding: 4px 10px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: 600;

    margin-left: 8px;

}

.review-status-pending {

    background: #fff3cd;

    color: #856404;

}

.review-status-approved {

    background: #d1e7dd;

    color: #0f5132;

}

.review-status-rejected {

    background: #f8d7da;

    color: #842029;

}

</style>

<style>

    margin-top: 18px;

    padding: 18px;

    border-top: 1px solid #e9e9e9;

    background: #fafafa;

    border-radius: 10px;

}

.order-review-heading {

    font-weight: 600;

    font-size: 15px;

    margin-bottom: 8px;

}

.order-review-stars {

    color: #e6a400;

    font-size: 20px;

    letter-spacing: 2px;

}

.order-review-title {

    font-weight: 600;

    margin-top: 8px;

}

.order-review-comment {

    color: #555;

    line-height: 1.6;

    margin-top: 6px;

}

.order-review-meta {

    color: #777;

    font-size: 13px;

    margin-top: 8px;

}

.order-review-images {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 10px;

}

.order-review-images img {

    width: 100px;

    height: 100px;

    object-fit: cover;

    border-radius: 8px;

    border: 1px solid #ddd;

}

    width: 350px;

    max-width: 100%;

    margin-top: 10px;

    border-radius: 8px;

}

.order-review-actions {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    margin-top: 15px;

}

.review-status-badge {

    display: inline-block;

    padding: 4px 9px;

    border-radius: 20px;

    font-size: 11px;

    margin-left: 6px;

}

.review-status-pending {

    background: #fff3cd;

    color: #856404;

}

.review-status-approved {

    background: #d1e7dd;

    color: #0f5132;

}

.review-status-rejected {

    background: #f8d7da;

    color: #842029;

}

</style>

</head>

<body class="bg-light">

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <a
            href="orders.html"
            class="btn btn-outline-secondary">

            ← Back to Orders

        </a>

        <h2 id="pageTitle">

            Order Details

        </h2>

    </div>

    <!-- TOP SUMMARY -->

    <div class="row g-4 mb-4">

        <div class="col-lg-3">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <small class="text-muted">

                        Grand Total

                    </small>

                    <h3
                        id="summaryTotal"
                        class="mt-2">

                        ₹0

                    </h3>

                </div>

            </div>

        </div>

        <div class="col-lg-3">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <small class="text-muted">

                        Payment Status

                    </small>

                    <div
                        id="paymentBadge"
                        class="mt-2">

                        -

                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-3">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <small class="text-muted">

                        Order Status

                    </small>

                    <div
                        id="orderBadge"
                        class="mt-2">

                        -

                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-3">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <small class="text-muted">

                        Order Date

                    </small>

                    <div
                        id="orderDate"
                        class="mt-2">

                        -

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- CUSTOMER + ADDRESS -->

    <div class="row g-4 mb-4">

        <div class="col-lg-6">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <h5 class="mb-4">

                        Customer Details

                    </h5>

                    <div id="customerInfo">

                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <h5 class="mb-4">

                        Delivery Address

                    </h5>

                    <div id="addressInfo">

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- PRODUCTS -->

    <div class="card shadow-sm border-0 mb-4">

        <div class="card-body">

            <h5 class="mb-4">

                Ordered Products

            </h5>

           <div id="productsTable">

</div>

        </div>

    </div>

    <!-- PAYMENT + ADMIN -->

    <div class="row g-4">

        <div class="col-lg-6">

            <div class="card shadow-sm border-0">

                <div class="card-body">

                    <h5 class="mb-4">

                        Payment Details

                    </h5>

                    <div id="paymentInfo">

                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="card shadow-sm border-0">

                <div class="card-body">

                    <h5 class="mb-4">

                        Admin Actions

                    </h5>

                    <label class="form-label">

                        Order Status

                    </label>

                    <select
                        id="statusSelect"
                        class="form-select mb-3">

                        <option>Pending</option>

                        <option>Confirmed</option>

                        <option>Packed</option>

                        <option>Shipped</option>

                        <option>Out for Delivery</option>

                        <option>Delivered</option>

                        <option>Cancelled</option>

                        <option>Returned</option>

                    </select>

                    <button
                        id="updateBtn"
                        class="btn btn-primary w-100 mb-4">

                        Update Order Status

                    </button>

                    <hr>

                    <label class="form-label">

                        Payment Status

                    </label>

                    <select
                        id="paymentStatusSelect"
                        class="form-select mb-3">

                        <option>Pending</option>

                        <option>Paid</option>

                        <option>Failed</option>

                        <option>Refunded</option>

                    </select>

                    <button
                        id="updatePaymentBtn"
                        class="btn btn-success w-100">

                        Update Payment Status

                    </button>

                </div>

            </div>

        </div>

    </div>


<div
    id="cancellationCard"
    class="card shadow-sm border-0 mt-4"
    style="display:none;">

    <div class="card-body">

        <h5 class="mb-4 text-danger">

            Cancellation Details

        </h5>

        <div id="cancellationInfo"></div>

    </div>

</div>

<div
    id="refundCard"
    class="card shadow-sm border-0 mt-4"
    style="display:none;">

    <div class="card-body">

        <h5 class="text-success mb-4">

            Refund Information

        </h5>

        <div id="refundInfo"></div>

    </div>

</div>

<!-- RETURN DETAILS -->

<div
    id="returnCard"
    class="card shadow-sm border-0 mt-4"
    style="display:none;">

    <div class="card-body">

        <h5 class="text-warning mb-4">

            Return Details

        </h5>

        <div id="returnInfo">

        </div>

        <button

            id="viewReturnBtn"

            class="btn btn-warning mt-3"

            style="display:none;">

            View Return Details

        </button>

    </div>

</div>
</div>

<script
type="module"
src="js/order.js">

</script>

</body>

</html>
