<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Order Details | Parakh Admin</title>

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<link
rel="stylesheet"
href="css/admin.css">

<style>

/* ============================================================
   CUSTOMER REVIEW IN ORDER
   ============================================================ */

.order-product-review {

    margin-top: 18px;

    padding: 18px;

    border-top: 1px solid #e9e9e9;

    background: #fafafa;

    border-radius: 10px;

}

.order-review-heading {

    font-weight: 600;

    font-size: 15px;

    margin-bottom: 10px;

}

.order-review-stars {

    color: #e6a400;

    font-size: 20px;

    letter-spacing: 2px;

}

.order-review-title {

    font-weight: 600;

    margin-top: 8px;

}

.order-review-comment {

    color: #555;

    line-height: 1.6;

    margin-top: 6px;

}

.order-review-meta {

    color: #777;

    font-size: 13px;

    margin-top: 10px;

}

.order-review-images {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 12px;

}

.order-review-images img {

    width: 100px;

    height: 100px;

    object-fit: cover;

    border-radius: 8px;

    border: 1px solid #ddd;

    cursor: pointer;

}

.order-review-video {

    margin-top: 12px;

    max-width: 350px;

    width: 100%;

    border-radius: 8px;

}

.order-review-actions {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    margin-top: 15px;

}

.order-review-actions button {

    border-radius: 6px;

}

.review-status-badge {

    display: inline-block;

    padding: 4px 10px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: 600;

    margin-left: 8px;

}

.review-status-pending {

    background: #fff3cd;

    color: #856404;

}

.review-status-approved {

    background: #d1e7dd;

    color: #0f5132;

}

.review-status-rejected {

    background: #f8d7da;

    color: #842029;

}

/* ============================================================
   REPLACEMENT ADMIN
   ============================================================ */

.replacement-admin-header{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:16px;

    flex-wrap:wrap;

    margin-bottom:24px;

}


.replacement-admin-eyebrow{

    font-size:11px;

    font-weight:700;

    letter-spacing:1.4px;

    color:#8c1d40;

    margin-bottom:5px;

}


.replacement-admin-title{

    margin:0;

    font-size:21px;

    font-weight:600;

}


.replacement-admin-status{

    display:inline-flex;

    align-items:center;

    padding:7px 13px;

    border-radius:20px;

    font-size:12px;

    font-weight:600;

}


.replacement-status-requested{

    background:#fff3cd;

    color:#856404;

}


.replacement-status-approved{

    background:#d1e7dd;

    color:#0f5132;

}

.replacement-status-ready{

    background:#dbeafe;

    color:#1e40af;

}


.replacement-status-rejected{

    background:#f8d7da;

    color:#842029;

}


.replacement-admin-grid{

    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(
                0,
                1fr
            )
        );

    gap:14px;

}


.replacement-admin-field{

    padding:15px;

    border:1px solid #e9e9e9;

    border-radius:10px;

    background:#fafafa;

}


.replacement-admin-label{

    display:block;

    color:#777;

    font-size:12px;

    margin-bottom:5px;

}


.replacement-admin-field strong{

    font-size:14px;

    color:#222;

}


.replacement-admin-photos{

    margin-top:22px;

    padding-top:20px;

    border-top:1px solid #eee;

}


.replacement-admin-section-title{

    font-weight:600;

    font-size:14px;

    margin-bottom:12px;

}


.replacement-photo-grid{

    display:flex;

    flex-wrap:wrap;

    gap:12px;

}


.replacement-photo-link{

    display:block;

    width:110px;

    height:135px;

    border-radius:10px;

    overflow:hidden;

    border:1px solid #ddd;

    background:#f5f5f5;

}


.replacement-photo-link img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

}


.replacement-admin-note{

    margin-top:20px;

    padding:15px;

    background:#faf6f0;

    border-radius:10px;

}


.replacement-admin-note p{

    margin:0;

    color:#555;

    line-height:1.6;

}
.replacement-admin-edit-grid{

    display:grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap:16px;

    margin-top:20px;

}


.replacement-admin-edit-field{

    padding:16px;

    border:1px solid #eee;

    border-radius:10px;

    background:#fafafa;

}


.replacement-admin-edit-field .form-select,
.replacement-admin-edit-field .form-control{

    margin-top:8px;

}


@media(max-width:600px){

    .replacement-admin-edit-grid{

        grid-template-columns:1fr;

    }

}

.replacement-admin-actions{

    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:24px;

    padding-top:20px;

    border-top:1px solid #eee;

}


.replacement-admin-actions button{

    min-height:44px;

}


#replacementAdminToast{

    position:fixed;

    right:24px;

    bottom:24px;

    z-index:99999;

    max-width:360px;

    padding:13px 18px;

    border-radius:10px;

    background:#123A34;

    color:#fff;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.18);

    font-size:14px;

    opacity:0;

    transform:
        translateY(10px);

    pointer-events:none;

    transition:.25s ease;

}


#replacementAdminToast.show{

    opacity:1;

    transform:
        translateY(0);

}


@media(max-width:600px){

    .replacement-admin-grid{

        grid-template-columns:1fr;

    }


    .replacement-admin-actions{

        flex-direction:column;

    }


    .replacement-admin-actions button{

        width:100%;

    }


    .replacement-photo-link{

        width:90px;

        height:112px;

    }


    #replacementAdminToast{

        left:15px;

        right:15px;

        bottom:15px;

        max-width:none;

    }

}

/* Keep Update Replacement button compact */
#updateReplacementDetailsBtn {
    width: auto !important;
    height: auto !important;
    min-height: 44px;
    align-self: flex-start;
    flex: 0 0 auto;
    white-space: nowrap;
}

</style>

    color: #e6a400;

    font-size: 20px;

    letter-spacing: 2px;

    font-weight: 600;

    margin-top: 8px;

    color: #555;

    line-height: 1.6;

    margin-top: 6px;

    color: #777;

    flex-wrap: wrap;

    gap: 10px;

</head>

<body class="bg-light">

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <a
            href="orders.html"
            class="btn btn-outline-secondary">

            ← Back to Orders

        </a>

        <h2 id="pageTitle">

            Order Details

        </h2>

    </div>

    <!-- TOP SUMMARY -->

    <div class="row g-4 mb-4">

        <div class="col-lg-3">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <small class="text-muted">

                        Grand Total

                    </small>

                    <h3
                        id="summaryTotal"
                        class="mt-2">

                        ₹0

                    </h3>

                </div>

            </div>

        </div>

        <div class="col-lg-3">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <small class="text-muted">

                        Payment Status

                    </small>

                    <div
                        id="paymentBadge"
                        class="mt-2">

                        -

                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-3">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <small class="text-muted">

                        Order Status

                    </small>

                    <div
                        id="orderBadge"
                        class="mt-2">

                        -

                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-3">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <small class="text-muted">

                        Order Date

                    </small>

                    <div
                        id="orderDate"
                        class="mt-2">

                        -

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- CUSTOMER + ADDRESS -->

    <div class="row g-4 mb-4">

        <div class="col-lg-6">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <h5 class="mb-4">

                        Customer Details

                    </h5>

                    <div id="customerInfo">

                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <h5 class="mb-4">

                        Delivery Address

                    </h5>

                    <div id="addressInfo">

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- PRODUCTS -->

    <div class="card shadow-sm border-0 mb-4">

        <div class="card-body">

            <h5 class="mb-4">

                Ordered Products

            </h5>

           <div id="productsTable">

</div>

        </div>

    </div>

    <!-- PAYMENT + ADMIN -->

    <div class="row g-4">

        <div class="col-lg-6">

            <div class="card shadow-sm border-0">

                <div class="card-body">

                    <h5 class="mb-4">

                        Payment Details

                    </h5>

                    <div id="paymentInfo">

                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="card shadow-sm border-0">

                <div class="card-body">

                    <h5 class="mb-4">

                        Admin Actions

                    </h5>

                    <label class="form-label">

                        Order Status

                    </label>

                    <select
                        id="statusSelect"
                        class="form-select mb-3">

                        <option>Pending</option>

                        <option>Confirmed</option>

                        <option>Packed</option>

                        <option>Shipped</option>

                        <option>Out for Delivery</option>

                        <option>Delivered</option>

                        <option>Cancelled</option>

                        <option>Returned</option>

                    </select>

                    <button
                        id="updateBtn"
                        class="btn btn-primary w-100 mb-4">

                        Update Order Status

                    </button>

                    <hr>

                    <label class="form-label">

                        Payment Status

                    </label>

                    <select
                        id="paymentStatusSelect"
                        class="form-select mb-3">

                        <option>Pending</option>

                        <option>Paid</option>

                        <option>Failed</option>

                        <option>Refunded</option>

                    </select>

                    <button
                        id="updatePaymentBtn"
                        class="btn btn-success w-100">

                        Update Payment Status

                    </button>

                </div>

            </div>

        </div>

    </div>


<div
    id="cancellationCard"
    class="card shadow-sm border-0 mt-4"
    style="display:none;">

    <div class="card-body">

        <h5 class="mb-4 text-danger">

            Cancellation Details

        </h5>

        <div id="cancellationInfo"></div>

    </div>

</div>

<div
    id="refundCard"
    class="card shadow-sm border-0 mt-4"
    style="display:none;">

    <div class="card-body">

        <h5 class="text-success mb-4">

            Refund Information

        </h5>

        <div id="refundInfo"></div>

    </div>

</div>

<!-- RETURN DETAILS -->

<div
    id="returnCard"
    class="card shadow-sm border-0 mt-4"
    style="display:none;">

    <div class="card-body">

        <h5 class="text-warning mb-4">

            Return Details

        </h5>

        <div id="returnInfo">

        </div>

        <button

            id="viewReturnBtn"

            class="btn btn-warning mt-3"

            style="display:none;">

            View Return Details

        </button>

    </div>

</div>


<!-- ============================================================
     REPLACEMENT DETAILS
     ============================================================ -->

<div
    id="replacementCard"
    class="card shadow-sm border-0 mt-4"
    style="display:none;">

    <div class="card-body">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">

            <h5 class="mb-0">

                Replacement Request

            </h5>

            <span
                class="text-muted"
                style="font-size:13px;">

                Customer Exchange

            </span>

        </div>


        <div id="replacementInfo">

        </div>

    </div>

</div>

</div>

<script
type="module"
src="js/order.js">

</script>

<script
type="module"
src="js/replacement-admin.js">

</script>

</body>

</html>
