<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Order Details | Parakh Admin</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<link
rel="stylesheet"
href="css/admin.css">

</head>

<body>

<div class="container py-4">

<h2 class="mb-4">

Order Details

</h2>

<div class="card mb-4">

<div class="card-body">

<h5 class="mb-3">

Order Information

</h5>

<div id="orderInfo">

Loading...

</div>

</div>

</div>

<div class="card mb-4">

<div class="card-body">

<h5 class="mb-3">

Customer

</h5>

<div id="customerInfo"></div>

</div>

</div>

<div class="card mb-4">

<div class="card-body">

<h5 class="mb-3">

Shipping Address

</h5>

<div id="addressInfo"></div>

</div>

</div>

<div class="card mb-4">

<div class="card-body">

<h5 class="mb-3">

Products

</h5>

<table class="table">

<thead>

<tr>

<th>Product</th>

<th>Qty</th>

<th>Price</th>

<th>Total</th>

</tr>

</thead>

<tbody id="productsTable">

</tbody>

</table>

</div>

</div>

<div class="card">

<div class="card-body">

<h5 class="mb-3">

Update Status

</h5>

<select
id="statusSelect"
class="form-select mb-3">

<option>Pending</option>
<option>Confirmed</option>
<option>Packed</option>
<option>Shipped</option>
<option>Out for Delivery</option>
<option>Delivered</option>
<option>Cancelled</option>
<option>Refunded</option>

</select>

<button
id="updateBtn"
class="btn btn-primary">

Update Status

</button>

</div>

</div>

</div>

<script
type="module"
src="js/order.js">

</script>

</body>

</html>
