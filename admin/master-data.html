<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Master Data</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link rel="stylesheet" href="css/admin.css">

</head>

<body>



<div class="admin-layout">

    <aside class="master-sidebar">

        <h2>Master Data</h2>

        <button class="master-tab active" data-type="categories">
            Categories
        </button>

        <button class="master-tab" data-type="colours">
            Colours
        </button>

        <button class="master-tab" data-type="fabrics">
            Fabrics
        </button>

        <button class="master-tab" data-type="collections">
            Collections
        </button>

        <button class="master-tab" data-type="occasions">
            Occasions
        </button>

    </aside>

    <main class="master-content">

        <div class="master-header">

            <h2 id="pageTitle">Categories</h2>

            <button
                id="addItemBtn"
                class="btn btn-primary">

                + Add

            </button>

        </div>

        <table class="master-table">

            <thead id="tableHead"></thead>

            <tbody id="tableBody"></tbody>

        </table>

    </main>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/master-data.js"></script>



<div class="modal fade" id="categoryModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content shadow-lg border-0 rounded-4">

           <div class="modal-header border-bottom">

                <h5 class="modal-title fw-bold" id="categoryModalTitle">
Add Category
</h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="mb-3">

                    <label class="form-label fw-semibold">
Name <span class="text-danger">*</span>
</label>

                   <input
id="catName"
class="form-control form-control-lg"
placeholder="Category name">

                </div>

                <div class="mb-3">

                  <label class="form-label fw-semibold">
Plural Name
</label>

<input
id="catPlural"
class="form-control form-control-lg"
placeholder="Plural name">

                </div>

       <div class="row">

    <div class="col-md-4">

        <div class="mb-3">

            <label class="form-label fw-semibold">

                Prefix

            </label>

            <input
                maxlength="2"
                id="catPrefix"
                class="form-control text-uppercase"
                placeholder="SR">

        </div>

    </div>

    <div class="col-md-8">

        <div class="mb-3">

            <label class="form-label fw-semibold">

                Display Order

            </label>

            <input
                type="number"
                id="catOrder"
                class="form-control"
                placeholder="1">

        </div>

    </div>

</div>

                <div class="form-check form-switch mt-3">

                    <input
                        checked
                        id="catActive"
                        type="checkbox"
                        class="form-check-input">

                    <label class="form-check-label">

                        Active

                    </label>

                </div>

            </div>

            <div class="modal-footer">

                <button
class="btn btn-light px-4"
data-bs-dismiss="modal">

Cancel

</button>

<button
id="saveCategoryBtn"
class="btn btn-primary px-4">

Save Category

</button>

            </div>

        </div>

    </div>

</div>


</body>

</html>
