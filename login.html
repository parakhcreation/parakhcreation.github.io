<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Parakh</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

body{

    margin:0;

    background:#f8f1e3;

    font-family:Manrope,sans-serif;

}

.auth-container{

    max-width:500px;

    margin:80px auto;

    background:white;

    padding:50px;

    border-radius:20px;

    box-shadow:0 20px 50px rgba(0,0,0,.08);

}

.auth-logo{

    text-align:center;

    font-family:Marcellus,serif;

    font-size:38px;

    color:#0d4b43;

    margin-bottom:10px;

}

.auth-sub{

    text-align:center;

    color:#666;

    margin-bottom:40px;

}

.form-group{

    margin-bottom:22px;

}

.form-group label{

    display:block;

    margin-bottom:8px;

    font-weight:600;

}

.form-group input{

    width:100%;

    padding:14px;

    border:1px solid #ddd;

    border-radius:10px;

    font-size:15px;

    box-sizing:border-box;

}

.auth-btn{

    width:100%;

    padding:15px;

    background:#0d4b43;

    color:white;

    border:none;

    border-radius:10px;

    font-size:16px;

    cursor:pointer;

}

.auth-btn:hover{

    background:#8c1d40;

}

.auth-bottom{

    margin-top:25px;

    text-align:center;

}

.auth-bottom a{

    color:#8c1d40;

    text-decoration:none;

    font-weight:600;

}

.forgot{

    text-align:right;

    margin-top:-8px;

    margin-bottom:20px;

}

.forgot a{

    color:#666;

    text-decoration:none;

    font-size:14px;

}

</style>

</head>

<body>

<div class="auth-container">

<div class="auth-logo">

पारख

</div>

<h2 style="text-align:center">

Welcome Back

</h2>

<p class="auth-sub">

Login to your account.

</p>

<form id="loginForm">

<div class="form-group">

<label>Email</label>

<input
type="email"
id="email"
required>

</div>

<div class="form-group">

<label>Password</label>

<input
type="password"
id="password"
required>

</div>

<div class="forgot">

<a href="#">

Forgot Password?</a>

</div>

<button
type="submit"
class="auth-btn">

Login

</button>

</form>

<div class="auth-bottom">

Don't have an account?

<a href="signup.html">

Create Account

</a>

</div>

</div>

<script type="module" src="js/customerAuth.js"></script>

</body>

</html>
