<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Shopping Cart</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    background:#f8f6f2;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:92%;
    max-width:1400px;
    margin:50px auto;
}

h1{
    margin-bottom:40px;
    font-size:40px;
}

.cart-layout{

    display:grid;

    grid-template-columns:2fr 1fr;

    gap:40px;

}

#cartItems{

    display:flex;

    flex-direction:column;

    gap:25px;

}

.cart-item{

    display:flex;

    gap:25px;

    background:white;

    padding:25px;

    border-radius:14px;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

}

.cart-item img{

    width:170px;

    height:220px;

    object-fit:cover;

    border-radius:10px;

}

.cart-details{

    flex:1;

}

.cart-details h2{

    margin-top:0;

}

.cart-price{

    color:#b11b47;

    font-size:26px;

    font-weight:bold;

    margin-top:15px;

}

.removeBtn{

    margin-top:25px;

    padding:10px 18px;

    border:none;

    background:#ddd;

    cursor:pointer;

    border-radius:6px;

}

.summary{

    position:sticky;

    top:30px;

    background:white;

    padding:30px;

    border-radius:14px;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

    height:fit-content;

}

.summary h2{

    margin-top:0;

}

.total-row{

    display:flex;

    justify-content:space-between;

    margin:18px 0;

    font-size:18px;

}

.checkout{

    width:100%;

    margin-top:25px;

    padding:18px;

    border:none;

    background:#b11b47;

    color:white;

    font-size:18px;

    border-radius:8px;

    cursor:pointer;

}

@media(max-width:900px){

.cart-layout{

grid-template-columns:1fr;

}

.cart-item{

flex-direction:column;

}

.cart-item img{

width:100%;

height:auto;

}

}

</style>

</head>

<div class="container">

<h1>Shopping Cart</h1>

<div class="cart-layout">

    <div id="cartItems"></div>

    <div class="summary">

        <h2>Order Summary</h2>

        <div class="total-row">

            <span>Subtotal</span>

            <span id="cartTotal">₹0</span>

        </div>

        <div class="total-row">

            <span>Shipping</span>

            <span>FREE</span>

        </div>

        <hr>

        <div class="total-row">

            <strong>Total</strong>

            <strong id="finalTotal">₹0</strong>

        </div>

        <button
        class="checkout"
        id="checkoutBtn">

            Proceed to Checkout

        </button>

    </div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script type="module" src="js/cart.js"></script>

</html>
