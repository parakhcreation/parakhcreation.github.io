<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Shopping Cart</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@500;600&display=swap"
    rel="stylesheet">

<style>

body{
    margin:0;
    background:#f8f6f2;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:92%;
    max-width:1400px;
    margin:50px auto;
}

h1{
    margin-bottom:40px;
    font-size:40px;
}

.cart-layout{

    display:grid;

    grid-template-columns:2fr 1fr;

    gap:40px;

}

#cartItems{

    display:flex;

    flex-direction:column;

    gap:25px;

}

.cart-item{

    display:flex;

    align-items:center;

    gap:25px;

    background:white;

    padding:25px;

    border-radius:14px;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

}

/* =========================================================
   PARAKH DESIGNER CHECKBOX
   ========================================================= */

.cart-item{
    position:relative;
}

/* Checkbox */

.cart-selection{

    position:absolute;

    top:18px;

    left:18px;

    width:21px;

    height:21px;

    margin:0;

    padding:0;

    appearance:none;
    -webkit-appearance:none;

    background:#fffdf9;

    border:1.5px solid #123A34;

    border-radius:6px;

    cursor:pointer;

    z-index:20;

    box-sizing:border-box;

    transition:
        background .22s ease,
        border-color .22s ease,
        box-shadow .22s ease,
        transform .18s ease;

}

/* Elegant inner gold accent */

.cart-selection::before{

    content:"";

    position:absolute;

    inset:3px;

    border:1px solid #8F6A1F;

    border-radius:3px;

    opacity:.45;

    transition:
        opacity .2s ease,
        transform .2s ease;

}

/* Hover */

.cart-selection:hover{

    border-color:#B11B47;

    box-shadow:
        0 0 0 3px rgba(177,27,71,.08);

}

.cart-selection:hover::before{

    opacity:.8;

}

/* SELECTED */

.cart-selection:checked{

    background:#B11B47;

    border-color:#B11B47;

    box-shadow:
        0 3px 8px rgba(177,27,71,.20);

}

/* Remove inner border when selected */

.cart-selection:checked::before{

    opacity:0;

    transform:scale(.6);

}

/* Elegant tick */

.cart-selection:checked::after{

    content:"";

    position:absolute;

    left:6px;

    top:3px;

    width:6px;

    height:10px;

    border-right:2px solid #fff;

    border-bottom:2px solid #fff;

    transform:rotate(45deg);

}

/* Keyboard focus */

.cart-selection:focus-visible{

    outline:none;

    box-shadow:
        0 0 0 3px rgba(143,106,31,.25);

}

.cart-item img{

    width:170px;

    height:220px;

    object-fit:cover;

    border-radius:10px;

}

.cart-details{

    flex:1;

}

.cart-details h2{

    margin-top:0;

}

.cart-price{

    color:#b11b47;

    font-size:26px;

    font-weight:bold;

    margin-top:15px;

}

.cart-product-link{
    cursor:pointer;
}

.cart-product-link:hover{
    opacity:.92;
}

.cart-details h2.cart-product-link:hover{
    color:#b11b47;
}

/* =========================
   CART QUANTITY CONTROLS
   ========================= */

.quantity-controls{

    display:flex;

    align-items:center;

    gap:10px;

    margin-top:16px;

}

.qty-btn{

    width:34px;

    height:34px;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:0;

    border:1px solid #123A34;

    border-radius:4px;

    background:#fff;

    color:#123A34;

    font-size:20px;

    font-weight:500;

    line-height:1;

    cursor:pointer;

    transition:all .2s ease;

}

.qty-btn:hover{

    background:#123A34;

    color:#fff;

}

.qty-btn:active{

    transform:scale(.95);

}

.qty{

    min-width:28px;

    text-align:center;

    font-size:17px;

    font-weight:600;

    color:#222;

}

.removeBtn{

    margin-top:0;

    padding:12px 22px;

    border:1px solid #123A34;

    background:#fff;

    color:#123A34;

    cursor:pointer;

    border-radius:5px;

    font-size:14px;

    font-weight:600;

    transition:all .25s ease;

    white-space:nowrap;

}

.removeBtn:hover{

    background:#123A34;

    color:#fff;

    transform:translateY(-1px);

}

.moveWishlistBtn{

    align-self:center;

    margin-top:10px;

    padding:11px 18px;

    border:1px solid #b11b47;

    background:#fff;

    color:#b11b47;

    cursor:pointer;

    border-radius:5px;

    font-size:14px;

    font-weight:600;

    transition:all .25s ease;

    white-space:nowrap;

}

.moveWishlistBtn:hover{

    background:#b11b47;

    color:#fff;

    transform:translateY(-1px);

}

.cart-section{
    width:100%;
}

.cart-section + .cart-section{
    margin-top:50px;
}

.cart-section-title{
    margin:0 0 20px;
    font-size:24px;
    font-weight:600;
    color:#123A34;
}

.cart-section-items{
    display:flex;
    flex-direction:column;
    gap:25px;
}

.out-of-stock-section{
    padding-top:10px;
    border-top:1px solid #e5e0d8;
}

.out-of-stock-heading{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:20px;
    margin-bottom:20px;
}

.out-of-stock-heading .cart-section-title{
    color:#8f1f3f;
}

.out-of-stock-note{
    color:#777;
    font-size:13px;
}

.cart-item-unavailable{
    background:#fffdfd;
}

.cart-item-unavailable .cart-price{
    color:#888;
}

.cart-item-out-of-stock{
    display:inline-block;
    margin-top:4px;
    margin-bottom:8px;
    padding:7px 12px;
    border-radius:4px;
    background:#fdf0f2;
    color:#b11b47;
    font-size:13px;
    font-weight:700;
    letter-spacing:.4px;
}

.quantity-controls.unavailable{
    opacity:.5;
}

.summary{

    position:sticky;

    top:30px;

    background:white;

    padding:30px;

    border-radius:14px;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

    height:fit-content;

}

.summary h2{

    margin-top:0;

}


.cart-actions{

    display:flex;

    flex-direction:column;

    align-items:stretch;

    gap:10px;

    align-self:center;

    min-width:150px;

}
.total-row{

    display:flex;

    justify-content:space-between;

    margin:18px 0;

    font-size:18px;

}

.checkout{

    width:100%;

    margin-top:25px;

    padding:18px;

    border:none;

    background:#b11b47;

    color:white;

    font-size:18px;

    border-radius:8px;

    cursor:pointer;

}

@media(max-width:900px){

.cart-layout{

grid-template-columns:1fr;

}

.cart-item{

flex-direction:column;

}

.cart-item img{

width:100%;

height:auto;

}

.cart-item-out-of-stock{

    display:inline-block;

    margin-top:12px;

    padding:7px 12px;

    border-radius:4px;

    background:#fdf0f2;

    color:#b11b47;

    font-size:14px;

    font-weight:700;

    letter-spacing:.3px;

}

.moveWishlistBtn{

    display:block;

    margin-top:12px;

    padding:10px 16px;

    border:1px solid #b11b47;

    border-radius:5px;

    background:#fff;

    color:#b11b47;

    font-size:13px;

    font-weight:600;

    cursor:pointer;

    transition:.2s ease;

}

.moveWishlistBtn:hover{

    background:#b11b47;

    color:#fff;

}

.quantity-controls.unavailable{

    opacity:.5;

}


}

/* =========================================================
   CART PAGE — PARAKH HEADER
   ========================================================= */

.product-nav{

    width:100%;

    background:#f3e9d8;

    border-bottom:1px solid rgba(0,0,0,.08);

}


/* Header layout */

.product-nav-inner{

    width:92%;

    max-width:1400px;

    min-height:78px;

    margin:0 auto;

    padding:10px 0;

    box-sizing:border-box;

    display:flex;

    align-items:center;

    justify-content:space-between;

}


/* =========================
   PARAKH LOGO
   ========================= */

.product-brand{

    display:flex;

    align-items:baseline;

    gap:10px;

    flex-shrink:0;

}


/* पारख */

.product-brand .brand-dev{

    font-family:'Noto Serif Devanagari',serif;

    font-size:30px;

    line-height:1;

    color:#A8194A;

}


/* PARAKH */

.product-brand .brand-word{

    display:block;

    font-family:'Marcellus','Cormorant Garamond',serif;

    font-size:40px;

    line-height:1;

    letter-spacing:.06em;

    color:#123A34;

}


/* Creation & Collection */

.product-brand .brand-sub{

    display:block;

    margin-top:-2px;

    font-family:'Poppins',sans-serif;

    font-size:20px;

    line-height:1;

    letter-spacing:.18em;

    text-transform:uppercase;

    color:#8F6A1F;

}


/* =========================
   RIGHT SIDE ICONS
   ========================= */

.product-nav-icons{

    margin-left:auto;

    display:flex;

    align-items:center;

    gap:18px;

}


/* Wishlist + Account */

.product-nav-icons .icon-btn{

    position:relative;

    border:none;

    background:none;

    padding:0;

    margin:0;

    font-size:26px;

    line-height:1;

    color:#123A34;

    cursor:pointer;

}


/* Cart */

.product-nav-icons .cart-icon{

    position:relative;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    font-size:28px;

    line-height:1;

    color:#123A34;

    text-decoration:none;

}


/* Counters */

.product-nav #wishlistCount,
.product-nav #cartCount{

    position:absolute;

    top:-7px;

    right:-9px;

    width:20px;

    height:20px;

    border-radius:50%;

    background:#C91B4F;

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-family:Arial,sans-serif;

    font-size:10px;

    font-weight:700;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:768px){

    .product-nav-inner{

        width:100%;

        min-height:58px;

        padding:7px 16px;

    }


    .product-brand{

        gap:6px;

    }


    .product-brand .brand-dev{

        font-size:13px;

    }


    .product-brand .brand-word{

        font-size:20px;

    }


    .product-brand .brand-sub{

        font-size:10px;

        letter-spacing:.18em;

    }


    .product-nav-icons{

        gap:10px;

    }


    .product-nav-icons .icon-btn{

        font-size:20px;

    }


    .product-nav-icons .cart-icon{

        font-size:20px;

    }


    .product-nav #wishlistCount,
    .product-nav #cartCount{

        width:16px;

        height:16px;

        top:-7px;

        right:-7px;

        font-size:8px;

    }

}

/* =========================================================
   MOBILE CART — HORIZONTAL PRODUCT CARDS
   ========================================================= */

@media (max-width:768px){

    .cart-item{

    position:relative;

    display:grid;

    grid-template-columns:105px minmax(0,1fr);

    grid-template-rows:auto auto;

    column-gap:14px;

    row-gap:10px;

    align-items:start;

    padding:12px;

    box-sizing:border-box;

}

/* MOBILE PRODUCT SELECTION CHECKBOX */

.cart-item .cart-selection{

    position:absolute;

    top:10px;

    left:10px;

    width:18px;

    height:18px;

    margin:0;

    padding:0;

    z-index:20;

    cursor:pointer;

}
    /* PRODUCT IMAGE — LEFT */
.cart-item .cart-selection{

    top:10px;

    left:10px;

    width:19px;

    height:19px;

}

    .cart-item > .cart-product-link{

        grid-column:1;

        grid-row:1 / 3;

        width:105px;

        height:140px;

        overflow:hidden;

        border-radius:6px;

        flex-shrink:0;

    }


    .cart-item > .cart-product-link img{

        width:100%;

        height:100%;

        object-fit:cover;

        display:block;

    }


    /* PRODUCT DETAILS — RIGHT */

    .cart-item > .cart-details{

        grid-column:2;

        grid-row:1;

        min-width:0;

        padding:0;

    }


    .cart-details h2{

        margin:0 0 6px;

        font-size:15px;

        line-height:1.3;

    }


    .cart-details p{

        margin:5px 0;

        font-size:12px;

        line-height:1.35;

    }


    .cart-price{

        margin-top:7px;

        font-size:17px;

    }


    /* QUANTITY */

    .quantity-controls{

        margin-top:9px;

        gap:7px;

    }


    .qty-btn{

        width:30px;

        height:30px;

        font-size:18px;

    }


    .qty{

        min-width:24px;

        font-size:14px;

    }


    /* REMOVE / WISHLIST — BELOW DETAILS */

    .cart-item > .cart-actions{

    grid-column:2;

    grid-row:2;

    width:100%;

    min-width:0;

    display:flex;

    flex-direction:column;

    align-items:stretch;

    gap:7px;

}


    .cart-actions button{

    width:100%;

    box-sizing:border-box;

    padding:7px 8px;

    font-size:11px;

    white-space:nowrap;

}


    .removeBtn{

        margin-top:0;

    }


    .moveWishlistBtn{

        margin-top:0;

    }

}

</style>

</head>

<body>

<header class="product-nav">

    <div class="product-nav-inner">

        <!-- PARAKH LOGO -->

        <div class="brand product-brand">

            <span class="brand-dev">पारख</span>

            <span>

                <span class="brand-word">PARAKH</span>

                <span class="brand-sub">
                    Creation &amp; Collection
                </span>

            </span>

        </div>


        <!-- WISHLIST / ACCOUNT / CART -->

        <div class="product-nav-icons">

            <button
                class="icon-btn"
                id="wishlistBtn"
                type="button"
                onclick="location.href='wishlist.html'"
                aria-label="Wishlist">

                ❤

                <span id="wishlistCount">0</span>

            </button>


            <button
    class="icon-btn"
    id="accountBtn"
    type="button"
    onclick="location.href='account.html'"
    aria-label="My Account">

    👤

</button>


            <a
                href="cart.html"
                class="cart-icon"
                aria-label="Cart">

                🛒

                <span id="cartCount">0</span>

            </a>

        </div>

    </div>

</header>


<div class="container">

<h1>Shopping Cart</h1>

<div class="cart-layout">

    <div id="cartItems"></div>

    <div class="summary">

        <h2>Order Summary</h2>

        <div class="total-row">

            <span>Subtotal</span>

            <span id="cartTotal">₹0</span>

        </div>

        <div class="total-row">

            <span>Shipping</span>

            <span>FREE</span>

        </div>

        <hr>

        <div class="total-row">

            <strong>Total</strong>

            <strong id="finalTotal">₹0</strong>

        </div>

        <button
        class="checkout"
        id="checkoutBtn">

            Proceed to Checkout

        </button>

    </div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script type="module" src="js/cart.js"></script>



</body>

</html>
