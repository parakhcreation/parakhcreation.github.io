<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Shopping Cart</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    background:#f8f6f2;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:92%;
    max-width:1400px;
    margin:50px auto;
}

h1{
    margin-bottom:40px;
    font-size:40px;
}

.cart-layout{

    display:grid;

    grid-template-columns:2fr 1fr;

    gap:40px;

}

#cartItems{

    display:flex;

    flex-direction:column;

    gap:25px;

}

.cart-item{

    display:flex;

    align-items:center;

    gap:25px;

    background:white;

    padding:25px;

    border-radius:14px;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

}

.cart-item img{

    width:170px;

    height:220px;

    object-fit:cover;

    border-radius:10px;

}

.cart-details{

    flex:1;

}

.cart-details h2{

    margin-top:0;

}

.cart-price{

    color:#b11b47;

    font-size:26px;

    font-weight:bold;

    margin-top:15px;

}

.cart-product-link{
    cursor:pointer;
}

.cart-product-link:hover{
    opacity:.92;
}

.cart-details h2.cart-product-link:hover{
    color:#b11b47;
}

/* =========================
   CART QUANTITY CONTROLS
   ========================= */

.quantity-controls{

    display:flex;

    align-items:center;

    gap:10px;

    margin-top:16px;

}

.qty-btn{

    width:34px;

    height:34px;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:0;

    border:1px solid #123A34;

    border-radius:4px;

    background:#fff;

    color:#123A34;

    font-size:20px;

    font-weight:500;

    line-height:1;

    cursor:pointer;

    transition:all .2s ease;

}

.qty-btn:hover{

    background:#123A34;

    color:#fff;

}

.qty-btn:active{

    transform:scale(.95);

}

.qty{

    min-width:28px;

    text-align:center;

    font-size:17px;

    font-weight:600;

    color:#222;

}

.removeBtn{

    margin-top:0;

    padding:12px 22px;

    border:1px solid #123A34;

    background:#fff;

    color:#123A34;

    cursor:pointer;

    border-radius:5px;

    font-size:14px;

    font-weight:600;

    transition:all .25s ease;

    white-space:nowrap;

}

.removeBtn:hover{

    background:#123A34;

    color:#fff;

    transform:translateY(-1px);

}

.moveWishlistBtn{

    align-self:center;

    margin-top:10px;

    padding:11px 18px;

    border:1px solid #b11b47;

    background:#fff;

    color:#b11b47;

    cursor:pointer;

    border-radius:5px;

    font-size:14px;

    font-weight:600;

    transition:all .25s ease;

    white-space:nowrap;

}

.moveWishlistBtn:hover{

    background:#b11b47;

    color:#fff;

    transform:translateY(-1px);

}

.cart-section{
    width:100%;
}

.cart-section + .cart-section{
    margin-top:50px;
}

.cart-section-title{
    margin:0 0 20px;
    font-size:24px;
    font-weight:600;
    color:#123A34;
}

.cart-section-items{
    display:flex;
    flex-direction:column;
    gap:25px;
}

.out-of-stock-section{
    padding-top:10px;
    border-top:1px solid #e5e0d8;
}

.out-of-stock-heading{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:20px;
    margin-bottom:20px;
}

.out-of-stock-heading .cart-section-title{
    color:#8f1f3f;
}

.out-of-stock-note{
    color:#777;
    font-size:13px;
}

.cart-item-unavailable{
    background:#fffdfd;
}

.cart-item-unavailable .cart-price{
    color:#888;
}

.cart-item-out-of-stock{
    display:inline-block;
    margin-top:4px;
    margin-bottom:8px;
    padding:7px 12px;
    border-radius:4px;
    background:#fdf0f2;
    color:#b11b47;
    font-size:13px;
    font-weight:700;
    letter-spacing:.4px;
}

.quantity-controls.unavailable{
    opacity:.5;
}

.summary{

    position:sticky;

    top:30px;

    background:white;

    padding:30px;

    border-radius:14px;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

    height:fit-content;

}

.summary h2{

    margin-top:0;

}


.cart-actions{

    display:flex;

    flex-direction:column;

    align-items:stretch;

    gap:10px;

    align-self:center;

    min-width:150px;

}
.total-row{

    display:flex;

    justify-content:space-between;

    margin:18px 0;

    font-size:18px;

}

.checkout{

    width:100%;

    margin-top:25px;

    padding:18px;

    border:none;

    background:#b11b47;

    color:white;

    font-size:18px;

    border-radius:8px;

    cursor:pointer;

}

@media(max-width:900px){

.cart-layout{

grid-template-columns:1fr;

}

.cart-item{

flex-direction:column;

}

.cart-item img{

width:100%;

height:auto;

}

.cart-item-out-of-stock{

    display:inline-block;

    margin-top:12px;

    padding:7px 12px;

    border-radius:4px;

    background:#fdf0f2;

    color:#b11b47;

    font-size:14px;

    font-weight:700;

    letter-spacing:.3px;

}

.moveWishlistBtn{

    display:block;

    margin-top:12px;

    padding:10px 16px;

    border:1px solid #b11b47;

    border-radius:5px;

    background:#fff;

    color:#b11b47;

    font-size:13px;

    font-weight:600;

    cursor:pointer;

    transition:.2s ease;

}

.moveWishlistBtn:hover{

    background:#b11b47;

    color:#fff;

}

.quantity-controls.unavailable{

    opacity:.5;

}


}

</style>

</head>

<div class="container">

<h1>Shopping Cart</h1>

<div class="cart-layout">

    <div id="cartItems"></div>

    <div class="summary">

        <h2>Order Summary</h2>

        <div class="total-row">

            <span>Subtotal</span>

            <span id="cartTotal">₹0</span>

        </div>

        <div class="total-row">

            <span>Shipping</span>

            <span>FREE</span>

        </div>

        <hr>

        <div class="total-row">

            <strong>Total</strong>

            <strong id="finalTotal">₹0</strong>

        </div>

        <button
        class="checkout"
        id="checkoutBtn">

            Proceed to Checkout

        </button>

    </div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script type="module" src="js/cart.js"></script>

</html>
