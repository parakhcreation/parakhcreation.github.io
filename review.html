<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Review Product | Parakh Creation</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com">

<link
    href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#f8f6f2;
    color:#222;

    font-family:Manrope,sans-serif;

}

.container{

    width:min(900px,94%);

    margin:auto;

    padding:50px 0;

}

.page-title{

    font-family:Marcellus,serif;

    font-size:42px;

    margin-bottom:35px;

}

.review-card{

    background:white;

    border-radius:18px;

    padding:35px;

    box-shadow:0 10px 30px rgba(0,0,0,.07);

}

.product-preview{

    display:flex;

    gap:20px;

    padding-bottom:30px;

    margin-bottom:30px;

    border-bottom:1px solid #eee;

}

.product-preview img{

    width:110px;

    height:140px;

    object-fit:cover;

    border-radius:12px;

}

.product-info{

    display:flex;

    flex-direction:column;

    justify-content:center;

}

.product-name{

    font-size:22px;

    font-weight:700;

    margin-bottom:10px;

}

.verified{

    display:inline-flex;

    align-items:center;

    gap:6px;

    color:#0d6b50;

    font-size:14px;

    font-weight:600;

}

.section{

    margin-bottom:30px;

}

.section-title{

    font-size:18px;

    font-weight:700;

    margin-bottom:12px;

}

.stars{

    display:flex;

    gap:8px;

}

.star{

    border:none;

    background:none;

    font-size:42px;

    color:#d5d5d5;

    cursor:pointer;

    padding:0;

    transition:.15s;

}

.star.active{

    color:#f5a623;

}

.star:hover{

    transform:scale(1.08);

}

input[type="text"],
textarea{

    width:100%;

    border:1px solid #ddd;

    border-radius:10px;

    padding:15px;

    font-family:Manrope,sans-serif;

    font-size:15px;

    outline:none;

}

input[type="text"]:focus,
textarea:focus{

    border-color:#8c1d40;

}

textarea{

    min-height:150px;

    resize:vertical;

}

.media-buttons{

    display:flex;

    gap:15px;

    flex-wrap:wrap;

}

.media-label{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:14px 20px;

    border:2px dashed #bbb;

    border-radius:12px;

    cursor:pointer;

    transition:.2s;

}

.media-label:hover{

    border-color:#8c1d40;

    color:#8c1d40;

}

.media-label input{

    display:none;

}

.media-preview{

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(110px,1fr));

    gap:12px;

    margin-top:15px;

}

.preview-item{

    position:relative;

    aspect-ratio:1;

    border-radius:10px;

    overflow:hidden;

    background:#f1f1f1;

}

.preview-item img,
.preview-item video{

    width:100%;

    height:100%;

    object-fit:cover;

}

.remove-media{

    position:absolute;

    top:6px;

    right:6px;

    width:28px;

    height:28px;

    border:none;

    border-radius:50%;

    background:rgba(0,0,0,.7);

    color:white;

    cursor:pointer;

}

.submit-button{

    width:100%;

    padding:17px;

    border:none;

    border-radius:12px;

    background:#8c1d40;

    color:white;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

}

.submit-button:hover{

    background:#6f1633;

}

.submit-button:disabled{

    opacity:.6;

    cursor:not-allowed;

}

.message{

    margin-top:15px;

    padding:12px 15px;

    border-radius:10px;

    display:none;

}

.message.error{

    display:block;

    background:#fff0f0;

    color:#b3261e;

}

.message.success{

    display:block;

    background:#edf8f2;

    color:#176b43;

}

@media(max-width:600px){

    .container{

        padding:30px 0;

    }

    .page-title{

        font-size:34px;

    }

    .review-card{

        padding:22px;

    }

    .product-preview img{

        width:85px;

        height:110px;

    }

    .product-name{

        font-size:18px;

    }

}

</style>

</head>

<body>

<div class="container">

<h1 class="page-title">
    Review Your Purchase
</h1>

<div class="review-card">

    <div
        id="productPreview"
        class="product-preview">

        <!-- Loaded by review.js -->

    </div>


    <!-- RATING -->

    <div class="section">

        <div class="section-title">
            How would you rate this product?
        </div>

        <div
            id="starRating"
            class="stars">

            <button class="star" data-rating="1">★</button>
            <button class="star" data-rating="2">★</button>
            <button class="star" data-rating="3">★</button>
            <button class="star" data-rating="4">★</button>
            <button class="star" data-rating="5">★</button>

        </div>

    </div>


    <!-- TITLE -->

    <div class="section">

        <div class="section-title">
            Review title
        </div>

        <input
            id="reviewTitle"
            type="text"
            maxlength="100"
            placeholder="e.g. Beautiful colour and quality">

    </div>


    <!-- DESCRIPTION -->

    <div class="section">

        <div class="section-title">
            Tell us about your experience
        </div>

        <textarea
            id="reviewComment"
            maxlength="2000"
            placeholder="What did you like about the product? How was the quality, fit, colour or material?"></textarea>

    </div>


    <!-- MEDIA -->

    <div class="section">

        <div class="section-title">
            Add photos or a video
        </div>

        <div class="media-buttons">

            <label class="media-label">

                📷 Add Photos

                <input
                    id="imageInput"
                    type="file"
                    accept="image/jpeg,image/png,image/webp"
                    multiple>

            </label>

            <label class="media-label">

                🎥 Add Video

                <input
                    id="videoInput"
                    type="file"
                    accept="video/mp4,video/webm"
                    >

            </label>

        </div>

        <div
            id="mediaPreview"
            class="media-preview">
        </div>

    </div>


    <button
        id="submitReview"
        class="submit-button">

        SUBMIT REVIEW

    </button>

    <div
        id="reviewMessage"
        class="message">
    </div>

</div>

</div>

<script
    type="module"
    src="js/review.js">
</script>

</body>

</html>
