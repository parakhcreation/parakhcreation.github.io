<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Orders | Parakh</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
 
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#f8f6f2;
    font-family:Manrope,sans-serif;
    color:#222;

}

.container{

    width:min(1400px,94%);
    margin:auto;
    padding:40px 0;

}

.pageTitle{

    font-family:Marcellus,serif;
    font-size:40px;
    margin-bottom:35px;

}

.checkoutGrid{

    display:grid;
    grid-template-columns:2fr 1fr;
    gap:35px;
    align-items:start;

}

.card{

    background:white;
    border-radius:18px;
    padding:28px;
    box-shadow:0 10px 25px rgba(0,0,0,.06);
    margin-bottom:25px;

}

.cardTitle{

    font-size:22px;
    font-weight:700;
    margin-bottom:22px;

}

.addressCard{

    border:2px solid #e8e8e8;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
    cursor:pointer;
    transition:.25s;

}

.addressCard:hover{

    border-color:#8c1d40;

}

.addressCard.selected{

    border-color:#8c1d40;
    background:#fff8fa;

}

.addressType{

    font-weight:700;
    margin-bottom:8px;

}

.defaultBadge{

    display:inline-block;
    background:#0d4b43;
    color:white;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    margin-left:8px;

}

.addressText{

    color:#555;
    line-height:1.7;

}

.addAddress{

    width:100%;
    padding:15px;
    border:2px dashed #bbb;
    background:white;
    border-radius:14px;
    cursor:pointer;
    font-size:16px;
    transition:.25s;

}

.addAddress:hover{

    border-color:#8c1d40;
    color:#8c1d40;

}

.formRow{

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;

}

.formGroup{

    margin-bottom:20px;

}

.formGroup label{

    display:block;
    margin-bottom:8px;
    font-weight:600;

}

.formGroup input{

    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;

}

.smallText{

    color:#777;
    margin-top:10px;
    font-size:14px;

}

.paymentOption{

    border:2px solid #e8e8e8;
    padding:18px;
    border-radius:14px;
    margin-bottom:15px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;

}

.paymentOption:hover{

    border-color:#8c1d40;

}

.paymentOption input{

    transform:scale(1.2);

}

.summaryCard{

    position:sticky;
    top:30px;
    background:white;
    border-radius:18px;
    padding:28px;
    box-shadow:0 10px 25px rgba(0,0,0,.06);

}

.summaryTitle{

    font-size:24px;
    font-weight:700;
    margin-bottom:25px;

}

.summaryProducts{

    margin-bottom:25px;

}

.summaryItem{

    display:flex;
    gap:14px;
    margin-bottom:18px;

}

.summaryImage{

    width:75px;
    height:95px;
    object-fit:cover;
    border-radius:10px;

}

.summaryInfo{

    flex:1;

}

.summaryName{

    font-weight:600;
    margin-bottom:8px;

}

.summaryPrice{

    color:#666;

}

.row{

    display:flex;
    justify-content:space-between;
    margin:15px 0;

}

.grandTotal{

    font-size:22px;
    font-weight:700;

}

.placeOrder{

    width:100%;
    padding:18px;
    border:none;
    border-radius:12px;
    background:#8c1d40;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:25px;

}

.placeOrder:hover{

    background:#6f1633;

}

@media(max-width:950px){

.checkoutGrid{

grid-template-columns:1fr;

}

.summaryCard{

position:static;

}

.formRow{

grid-template-columns:1fr;

}

}

.order-card{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:30px;

    background:white;

    border-radius:18px;

    padding:28px;

    margin-bottom:24px;

    box-shadow:0 10px 30px rgba(0,0,0,.06);

}

.order-left{

    flex-shrink:0;

}

.order-middle{

    flex:1;

}

.order-right{

    display:flex;

    flex-direction:column;

    align-items:flex-end;

    justify-content:center;

    gap:18px;

}

.order-number{

    margin-top:18px;

}

.order-date{

    color:#777;

}

.more-items{

    color:#888;

    font-size:14px;

    margin-top:8px;

}

.price{

    color:#8c1d40;

    margin-bottom:25px;

}

.button-row{

    display:flex;

    flex-direction:column;

    gap:14px;

    align-items:stretch;

    width:220px;

}

.button-row button{

    width:100%;

    height:48px;

    border-radius:12px;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:.25s;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

}

.detailsBtn{

    background:white;

    color:#8c1d40;

    border:2px solid #8c1d40;

}

.detailsBtn:hover{

    background:#8c1d40;

    color:white;

}

.cancelBtn{

    background:white;

    color:#c62828;

    border:2px solid #c62828;

}

.cancelBtn:hover{

    background:#c62828;

    color:white;

}
.returnBtn{

    background:white;

    color:#1565c0;

    border:2px solid #1565c0;

}

.returnBtn:hover{

    background:#1565c0;

    color:white;

}

.trackReturnBtn{

    background:#8c1d40;

    color:white;

    border:none;

}

.trackReturnBtn:hover{

    background:#6f1633;

}
.order-image{

    width:160px;

    height:210px;

    object-fit:cover;

    border-radius:12px;

}

.order-info{

    flex:1;

}

.status{

    display:inline-block;

    background:#fff4da;

    color:#9c6b00;

    padding:6px 14px;

    border-radius:30px;

    font-size:14px;

    margin-bottom:18px;

    font-weight:600;

}

.order-info h2{

    margin-bottom:12px;

}

.order-info p{

    color:#666;

    margin:8px 0;

}

.order-info button{

    margin-top:18px;

    margin-right:12px;

    padding:12px 24px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    background:#8c1d40;

    color:white;

}

.review-buttons {

    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;

}

.reviewBtn {

    width:100%;
    height:48px;

    border-radius:12px;

    font-size:15px;
    font-weight:600;

    cursor:pointer;

    background:#8c1d40;
    color:white;

    border:none;

    transition:.25s;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

}

.reviewBtn:hover {

    background:#6f1633;

}

/* =========================================================
   MOBILE MY ORDERS — RESPONSIVE ORDER CARDS
   ========================================================= */

@media (max-width:768px){

    html,
    body{

        width:100%;
        max-width:100%;
        overflow-x:hidden;

    }

    .container{

        width:100%;
        max-width:100%;
        padding:24px 14px;
        box-sizing:border-box;

    }

    .pageTitle{

        font-size:32px;
        line-height:1.2;
        margin-bottom:24px;

    }


    /* =========================
       ORDER CARD
       ========================= */

    .order-card{

        width:100%;
        max-width:100%;
        min-width:0;

        display:grid;

        grid-template-columns:92px minmax(0,1fr);

        grid-template-rows:auto auto;

        column-gap:14px;
        row-gap:18px;

        padding:16px;

        margin-bottom:18px;

        box-sizing:border-box;

        overflow:hidden;

    }


    /* =========================
       PRODUCT IMAGE
       ========================= */

    .order-left{

        grid-column:1;
        grid-row:1;

        width:92px;
        min-width:0;

    }

    .order-image{

        width:92px;
        height:122px;

        max-width:100%;

        object-fit:cover;

        border-radius:9px;

        display:block;

    }


    /* =========================
       ORDER INFORMATION
       ========================= */

    .order-middle{

        grid-column:2;
        grid-row:1;

        min-width:0;
        width:100%;

        overflow:hidden;

    }

    .order-info{

        min-width:0;
        width:100%;

    }

    .order-info h2{

        margin:8px 0 10px;

        font-size:17px;
        line-height:1.3;

        overflow-wrap:anywhere;
        word-break:break-word;

    }

    .order-info p{

        margin:6px 0;

        font-size:13px;
        line-height:1.45;

        overflow-wrap:anywhere;
        word-break:break-word;

    }

    .status{

        font-size:12px;

        padding:5px 10px;

        margin-bottom:8px;

    }

    .order-number{

        margin-top:10px;

    }

    .order-date{

        font-size:12px;

    }

    .more-items{

        font-size:12px;

    }


    /* =========================
       PRICE + BUTTONS
       ========================= */

    .order-right{

        grid-column:1 / -1;
        grid-row:2;

        width:100%;
        min-width:0;

        display:flex;

        flex-direction:column;

        align-items:stretch;

        gap:12px;

        box-sizing:border-box;

    }

    .price{

        margin:0;

        font-size:22px;

        line-height:1.2;

        text-align:right;

    }

    .button-row{

        width:100%;
        max-width:100%;
        min-width:0;

        display:flex;

        flex-direction:column;

        gap:10px;

    }

    .button-row button{

        width:100%;
        max-width:100%;

        height:46px;

        padding:0 12px;

        box-sizing:border-box;

        font-size:14px;

        white-space:normal;

    }


    /* =========================
       REVIEW BUTTONS
       ========================= */

    .review-buttons{

        width:100%;
        max-width:100%;

        gap:10px;

    }

    .reviewBtn{

        width:100%;
        max-width:100%;

        height:46px;

        font-size:14px;

    }


    /* =========================
       EXTRA SAFETY FOR LONG TEXT
       ========================= */

    .order-card *,
    .order-card h1,
    .order-card h2,
    .order-card h3,
    .order-card p{

        max-width:100%;

    }

}



</style>

</head>

<body>

<div class="container">

<h1 class="pageTitle">
My Orders
</h1>

<div id="loadingState">
    Loading your orders...
</div>

<div id="emptyState" style="display:none;">
    <h2>No Orders Yet</h2>
    <p>You haven't placed any orders.</p>
</div>

<div id="ordersContainer"></div>

<script type="module" src="js/my-orders.js"></script>

<script type="module" src="js/replace-order.js"></script>

</body>

</html>
