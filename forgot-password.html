<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | Parakh</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

body{

    margin:0;

    background:#f8f1e3;

    font-family:Manrope,sans-serif;

}

.auth-container{

    max-width:500px;

    margin:80px auto;

    background:white;

    padding:50px;

    border-radius:20px;

    box-shadow:0 20px 50px rgba(0,0,0,.08);

}

.auth-logo{

    text-align:center;

    font-family:Marcellus,serif;

    font-size:38px;

    color:#0d4b43;

    margin-bottom:10px;

}

.auth-sub{

    text-align:center;

    color:#666;

    margin-bottom:40px;

    line-height:1.6;

}

.form-group{

    margin-bottom:22px;

}

.form-group label{

    display:block;

    margin-bottom:8px;

    font-weight:600;

}

.form-group input{

    width:100%;

    padding:14px;

    border:1px solid #ddd;

    border-radius:10px;

    font-size:15px;

    box-sizing:border-box;

}

.auth-btn{

    width:100%;

    padding:15px;

    background:#0d4b43;

    color:white;

    border:none;

    border-radius:10px;

    font-size:16px;

    cursor:pointer;

}

.auth-btn:hover{

    background:#8c1d40;

}

.auth-bottom{

    margin-top:25px;

    text-align:center;

}

.auth-bottom a{

    color:#8c1d40;

    text-decoration:none;

    font-weight:600;

}

.message{

    margin-top:20px;

    text-align:center;

    font-size:14px;

    line-height:1.5;

}

</style>

</head>

<body>

<div class="auth-container">

    <div class="auth-logo">

        पारख

    </div>

    <h2 style="text-align:center">

        Forgot Password?

    </h2>

    <p class="auth-sub">

        Enter the email address associated with your account and we'll help you reset your password.

    </p>

    <form id="forgotPasswordForm">

        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                id="resetEmail"
                required
                autocomplete="email">

        </div>

        <button
            type="submit"
            class="auth-btn">

            Send Reset Link

        </button>

    </form>

    <div id="resetMessage" class="message"></div>

    <div class="auth-bottom">

        <a href="login.html">

            ← Back to Login

        </a>

    </div>

</div>

<script type="module" src="js/customerAuth.js"></script>

</body>

</html>
